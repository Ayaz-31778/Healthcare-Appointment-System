<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth"><div class="auth-card"><a class="brand center" href="index.html">HealthCare+</a><h1>Create Account</h1><p class="muted center">Register as a patient.</p><form id="signupForm"><label>Full Name</label><input id="name" required placeholder="Enter your name"><label>Email</label><input id="email" type="email" required placeholder="Enter email"><label>Password</label><input id="password" type="password" minlength="6" required placeholder="Minimum 6 characters"><label>Confirm Password</label><input id="confirm" type="password" minlength="6" required><button class="btn primary full">Create Account</button><p id="message" class="message"></p></form><p class="center bottom">Already registered? <a href="login.html">Login</a></p></div><script src="js/storage.js"></script><script src="js/auth.js"></script></body></html>
