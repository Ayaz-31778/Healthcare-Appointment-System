<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Manage Doctors</title><link rel="stylesheet" href="../css/style.css"></head>
<body><nav class="navbar admin"><a class="brand" href="dashboard.html">HealthCare+ <span>ADMIN</span></a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a class="active" href="doctors.html">Doctors</a><a href="users.html">Users</a><a href="appointments.html">Appointments</a><button id="logoutBtn" class="btn danger small">Logout</button></div></nav>
<main class="container page"><div class="title"><div><p class="eyebrow">ADMIN MODULE</p><h1>Doctor Management</h1></div><button id="addDoctor" class="btn primary">+ Add Doctor</button></div><section id="formPanel" class="panel hidden"><h2 id="formTitle">Add Doctor</h2><form id="doctorForm" class="form-grid"><input type="hidden" id="doctorId"><div><label>Doctor Name</label><input id="doctorName" required></div><div><label>Specialization</label><select id="doctorSpecialty"><option>General Physician</option><option>Cardiologist</option><option>Dermatologist</option><option>Pediatrician</option><option>Neurologist</option><option>Orthopedic</option></select></div><div><label>Experience</label><input id="experience" placeholder="e.g. 8 years" required></div><div><label>Consultation Fee</label><input id="fee" type="number" min="0" required></div><div class="full"><label>Available Days</label><input id="days" placeholder="Mon, Tue, Wed" required></div><div class="full"><label>About Doctor</label><textarea id="about" rows="3" required></textarea></div><div class="full actions"><button class="btn primary">Save Doctor</button><button id="cancel" type="button" class="btn outline">Cancel</button></div></form></section><section class="panel"><div id="doctorTable"></div></section></main><script src="../js/storage.js"></script><script src="../js/admin.js"></script></body></html>
